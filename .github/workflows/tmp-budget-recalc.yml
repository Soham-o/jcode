name: Temporary JCode budget recalculation

on:
  push:
    branches:
      - tmp/692-budget-recalc-oct15

permissions:
  contents: read

jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recalculate and validate current baselines
        run: |
          python scripts/check_code_size_budget.py --update
          python scripts/check_test_size_budget.py --update
          python scripts/check_code_size_budget.py
          python scripts/check_test_size_budget.py
          python scripts/check_panic_budget.py
          echo '===CODE_SIZE_JSON_BEGIN==='
          cat scripts/code_size_budget.json
          echo '===CODE_SIZE_JSON_END==='
          echo '===TEST_SIZE_JSON_BEGIN==='
          cat scripts/test_size_budget.json
          echo '===TEST_SIZE_JSON_END==='
